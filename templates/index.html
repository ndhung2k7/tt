<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cắt Video Online</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: #f9f9f9;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background: #28a745;
            color: white;
            border: none;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:disabled {
            background: #6c757d;
            cursor: not-allowed;
        }
        .progress {
            display: none;
            text-align: center;
            margin-top: 20px;
            color: #007bff;
        }
        .error {
            color: #dc3545;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>✂️ Cắt Video Thành Nhiều Phần</h1>
    <form id="splitForm">
        <div class="form-group">
            <label for="video">Chọn video (MP4, AVI, MKV,...):</label>
            <input type="file" id="video" name="video" accept="video/*" required>
        </div>
        <div class="form-group">
            <label for="mode">Chế độ cắt:</label>
            <select id="mode" name="mode">
                <option value="duration">Cắt theo thời lượng (phút/đoạn)</option>
                <option value="count">Cắt theo số lượng phần</option>
            </select>
        </div>
        <div class="form-group">
            <label for="value">Giá trị:</label>
            <input type="number" id="value" name="value" step="any" min="0.1" placeholder="Ví dụ: 10 (phút) hoặc 5 (phần)" required>
        </div>
        <button type="submit" id="submitBtn">Cắt và Tải về</button>
    </form>
    <div class="progress" id="progress">⏳ Đang xử lý video, vui lòng chờ...</div>
    <div class="error" id="error"></div>

    <script>
        const form = document.getElementById('splitForm');
        const progressDiv = document.getElementById('progress');
        const errorDiv = document.getElementById('error');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorDiv.textContent = '';
            const videoFile = document.getElementById('video').files[0];
            if (!videoFile) {
                errorDiv.textContent = 'Vui lòng chọn file video.';
                return;
            }

            const formData = new FormData();
            formData.append('video', videoFile);
            formData.append('mode', document.getElementById('mode').value);
            formData.append('value', document.getElementById('value').value);

            submitBtn.disabled = true;
            progressDiv.style.display = 'block';

            try {
                const response = await fetch('/upload-and-split', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const err = await response.json();
                    throw new Error(err.detail || 'Lỗi không xác định');
                }

                // Nhận file zip và tự động tải về
                const blob = await response.blob();
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'split_videos.zip';
                document.body.appendChild(a);
                a.click();
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);

                progressDiv.style.display = 'none';
                alert('✅ Tải về thành công!');

            } catch (error) {
                errorDiv.textContent = '❌ ' + error.message;
                progressDiv.style.display = 'none';
            } finally {
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
